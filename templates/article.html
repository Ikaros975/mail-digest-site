<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{title}}</title>
  <style>
    :root {
      --bg: #f7f5f0;
      --card: #ffffff;
      --ink: #1c1917;
      --muted: #78716c;
      --accent: #0f766e;
      --line: #e7e5e4;
      --link: #0e7490;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC",
        "Source Han Sans SC", "Microsoft YaHei", system-ui, sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, #dbeafe55, transparent),
        radial-gradient(900px 500px at 100% 0%, #ccfbf155, transparent),
        var(--bg);
      color: var(--ink);
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 28px 18px 64px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 28px 26px 36px;
      box-shadow: 0 10px 40px rgba(28, 25, 23, 0.06);
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 10px;
    }
    .meta {
      color: var(--muted);
      font-size: 13px;
      margin: 0 0 22px;
    }
    article h1 {
      font-size: clamp(1.45rem, 3.6vw, 1.85rem);
      line-height: 1.35;
      margin: 0 0 8px;
      letter-spacing: -0.01em;
    }
    article h2 {
      font-size: 1.2rem;
      margin: 1.8em 0 0.55em;
      padding-top: 0.4em;
      border-top: 1px solid var(--line);
    }
    article h3 {
      font-size: 1.05rem;
      margin: 1.4em 0 0.4em;
      color: #292524;
    }
    article p { margin: 0.7em 0; }
    article a {
      color: var(--link);
      text-decoration: underline;
      text-underline-offset: 3px;
      word-break: break-all;
    }
    article ul, article ol { padding-left: 1.2em; }
    article li { margin: 0.35em 0; }
    article blockquote {
      margin: 1em 0;
      padding: 0.2em 0 0.2em 1em;
      border-left: 3px solid #99f6e4;
      color: #44403c;
      background: #f0fdfa66;
    }
    .footer {
      margin-top: 32px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }
    @media (max-width: 520px) {
      .card { padding: 22px 16px 28px; border-radius: 14px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="eyebrow">{{eyebrow}}</div>
      <article>
        {{body}}
      </article>
      <div class="footer">归档阅读页 · 由邮件推送自动生成</div>
    </div>
  </div>
</body>
</html>
